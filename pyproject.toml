[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdmjest"
dynamic = ["version"]
dependencies = [
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "statsmodels>=0.15.0",
    "lmfit>=1.3.4"
]
requires-python = ">=3.13"
authors = [
    {name = "Santiago Guerrero-Higareda", email = "s.g.higareda@proton.me"}
]
maintainers = [
    {name = "Santiago Guerrero-Higareda", email = "s.g.higareda@proton.me"}
]
description = "Bootstrapped Davidson-MacKinnon J-test for linear and non-linear regression models"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["statistics", "econometrics", "bootstrapping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Python",
    "Python :: 3 :: Only",
    "Python :: 3.13",
    "Python:: 3.14",
    "Python 3.15",
    "Operating System :: OS Independent",
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: Mac
]

[project.urls]
"Homepage" = "https://github.com/santiagohigareda/bdmjtest"
"Wiki" = "https://github.com/santiagohigareda/bdmjtest/wiki"
