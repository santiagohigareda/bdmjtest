[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "bdmjtest"
dynamic = ["version"]
description = "Bootstrapped Davidson-MacKinnon J-test for linear and non-linear regression models"
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICEN[CS]E.*"]
requires-python = ">=3.13"
authors = [
    {name = "Santiago Guerrero-Higareda", email = "s.g.higareda@proton.me"}
]
maintainers = [
    {name = "Santiago Guerrero-Higareda", email = "s.g.higareda@proton.me"}
]
keywords = ["statistics", "econometrics", "bootstrap", "hypothesis-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "statsmodels>=0.15.0",
    "lmfit>=1.3.4",
]

[project.urls]
"Homepage" = "https://github.com/santiagohigareda/bdmjtest"
"Wiki" = "https://github.com/santiagohigareda/bdmjtest/wiki"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/bdmjtest/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bdmjtest"]
